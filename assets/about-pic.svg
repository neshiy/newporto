<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="chartBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="chartBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="chartBar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softGlowAbout" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="600" rx="28" fill="url(#aboutBg)"/>
  
  <!-- Aesthetic Geometric Glow Circles -->
  <circle cx="250" cy="220" r="160" fill="#ffffff" opacity="0.4" filter="url(#softGlowAbout)"/>
  <circle cx="400" cy="120" r="70" fill="#fbcfe8" opacity="0.5" filter="url(#softGlowAbout)"/>
  <circle cx="90" cy="380" r="80" fill="#c084fc" opacity="0.3" filter="url(#softGlowAbout)"/>

  <!-- Sparkles -->
  <path d="M90,80 Q90,105 65,105 Q90,105 90,130 Q90,105 115,105 Q90,105 90,80" fill="#ffffff" opacity="0.9"/>
  <path d="M420,240 Q420,260 400,260 Q420,260 420,280 Q420,260 440,260 Q420,260 420,240" fill="#ffffff" opacity="0.85"/>
  <path d="M70,260 Q70,275 55,275 Q70,275 70,290 Q70,275 85,275 Q70,275 70,260" fill="#ffffff" opacity="0.75"/>
  <path d="M390,440 Q390,460 370,460 Q390,460 390,480 Q390,460 410,460 Q390,460 390,440" fill="#ffffff" opacity="0.9"/>

  <!-- Creative Elements: Code window, Design Canvas, and Analytics Chart floating -->
  
  <!-- 1. Code Window (Software Engineer) -->
  <g transform="translate(60, 90)">
    <rect width="210" height="150" rx="16" fill="#ffffff" opacity="0.95" stroke="#ddd6fe" stroke-width="2"/>
    <rect width="210" height="30" rx="16" fill="#ede9fe"/>
    <circle cx="20" cy="15" r="4.5" fill="#f43f5e"/>
    <circle cx="36" cy="15" r="4.5" fill="#facc15"/>
    <circle cx="52" cy="15" r="4.5" fill="#10b981"/>
    <!-- Code Lines -->
    <rect x="20" y="45" width="45" height="7" rx="3.5" fill="#7c3aed"/>
    <rect x="72" y="45" width="60" height="7" rx="3.5" fill="#a855f7"/>
    <rect x="35" y="65" width="85" height="7" rx="3.5" fill="#ec4899"/>
    <rect x="35" y="85" width="130" height="7" rx="3.5" fill="#3b82f6"/>
    <rect x="50" y="105" width="90" height="7" rx="3.5" fill="#10b981"/>
    <rect x="20" y="125" width="30" height="7" rx="3.5" fill="#7c3aed"/>
  </g>

  <!-- 2. Data Chart Card (Data Analyst) -->
  <g transform="translate(230, 160)">
    <rect width="210" height="155" rx="16" fill="#ffffff" opacity="0.95" stroke="#ddd6fe" stroke-width="2"/>
    <rect width="210" height="30" rx="16" fill="#fae8ff"/>
    <text x="18" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#86198f">DATA INSIGHTS ✦</text>
    <!-- Chart Bars -->
    <rect x="30" y="85" width="22" height="45" rx="5" fill="url(#chartBar1)"/>
    <rect x="65" y="65" width="22" height="65" rx="5" fill="url(#chartBar2)"/>
    <rect x="100" y="50" width="22" height="80" rx="5" fill="url(#chartBar3)"/>
    <rect x="135" y="75" width="22" height="55" rx="5" fill="url(#chartBar1)"/>
    <rect x="170" y="40" width="22" height="90" rx="5" fill="url(#chartBar2)"/>
    <!-- Line chart overlay -->
    <path d="M41,85 Q76,60 111,50 T181,40" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 3. Visual Designer Palette & Laptop Centerpiece -->
  <g transform="translate(100, 310)">
    <!-- Laptop Base -->
    <ellipse cx="150" cy="235" rx="180" ry="24" fill="#c4b5fd" opacity="0.4"/>
    <path d="M20,210 L280,210 L300,230 L0,230 Z" fill="url(#laptopBody)" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="110" y="213" width="80" height="6" rx="3" fill="#a78bfa"/>
    <!-- Laptop Screen -->
    <rect x="35" y="60" width="230" height="150" rx="12" fill="url(#laptopBody)" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="45" y="70" width="210" height="130" rx="8" fill="url(#screenGrad)"/>
    
    <!-- Design & Code Workspace on Laptop -->
    <rect x="60" y="85" width="90" height="60" rx="8" fill="#ffffff" opacity="0.15"/>
    <circle cx="105" cy="115" r="18" fill="#ec4899" opacity="0.8"/>
    <rect x="165" y="85" width="75" height="10" rx="5" fill="#a78bfa"/>
    <rect x="165" y="103" width="60" height="8" rx="4" fill="#f472b6"/>
    <rect x="165" y="119" width="70" height="8" rx="4" fill="#67e8f9"/>
    <rect x="60" y="155" width="180" height="32" rx="6" fill="#ffffff" opacity="0.2"/>
    <text x="75" y="176" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Christina Perera Portfolio</text>
  </g>

  <!-- Floating Design Color Swatches -->
  <circle cx="100" cy="480" r="14" fill="#a855f7" stroke="#ffffff" stroke-width="3"/>
  <circle cx="130" cy="485" r="14" fill="#ec4899" stroke="#ffffff" stroke-width="3"/>
  <circle cx="160" cy="480" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>

  <!-- Sparkle Stars near the base -->
  <path d="M430,480 Q430,495 415,495 Q430,495 430,510 Q430,495 445,495 Q430,495 430,480" fill="#ffffff" opacity="0.9"/>
</svg>
